name: Discovery sync

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  # Discovery-sensitive main changes require exact-HEAD production proof.
  # The worker remains pending-only and all credentials stay on its last step.
  push:
    branches: [main]
    paths:
      - 'scripts/discovery/**'
      - 'supabase/migrations/**'
      - 'supabase/seeds/0002_pilot_sources.sql'
      - '.github/workflows/discovery.yml'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: discovery-production
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    # Bound the job: 18 sources x 20s hop timeouts + feeds/roundups + gates
    # finish well under this; a zombie run must not occupy the schedule slot.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Permanent contract: tests, typecheck, lint, boundary assertions,
      # change classification and a machine-readable exact-SHA report.
      - name: Run permanent verification gates
        env:
          VERIFY_BASE_SHA: ${{ github.event.before }}
        run: npm run verify

      # Secrets are attached ONLY to this step: the quality gates above run
      # with no credentials at all.
      - name: Run discovery worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --import tsx scripts/discovery/index.ts
