name = "tech-opportunity-discovery-scheduler"
main = "cloudflare-worker.ts"
compatibility_date = "2026-09-23"
workers_dev = false
preview_urls = false

[triggers]
crons = ["17 */2 * * *"]

[vars]
GITHUB_OWNER = "mohamedalizan2025-cpu"
GITHUB_REPOSITORY = "techopportunity-tanzania"
GITHUB_WORKFLOW = "discovery.yml"
GITHUB_REF = "main"

[secrets]
required = ["GITHUB_TOKEN"]

[observability]
enabled = true
head_sampling_rate = 1
